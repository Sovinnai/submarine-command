[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submarine-command"
version = "0.10.0"
description = "A deterministic submarine command game with hidden state and an evidence-limited narrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
submarine-command = "submarine_command.engine:main"
submarine-command-narrator = "submarine_command.narrator:main"

[tool.setuptools.packages.find]
include = ["submarine_command*"]
